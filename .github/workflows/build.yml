name: Build Sweetgram IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install deps (if needed)
        run: |
          brew update || true

      - name: Build Telegram (no signing attempt)
        run: |
          python3 build-system/Make/Make.py \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath=build-system/template_minimal_development_configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --buildNumber=100001 \
            --configuration=debug_arm64 || true

      - name: Locate app
        run: |
          find . -name "*.app" || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find . -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r Sweetgram.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Sweetgram-IPA
          path: Sweetgram.ipa
